<title>MF Facts Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a single reading column - disclosure header, prompt chips, transcript, sticky ask bar. */
:root{
  --paper:#f6f5f2; --card:#ffffff; --rule:#ddd9d1; --rule-soft:#eae6de;
  --ink:#1a1c1f; --ink-soft:#63656b;
  --seal:#14604a; --seal-wash:#e7f0ec;
  --flag:#8a4b12; --flag-wash:#f8efe4;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171a; --card:#1c1f23; --rule:#343941; --rule-soft:#272b31;
    --ink:#eceae5; --ink-soft:#9a9ea6;
    --seal:#6cc3a3; --seal-wash:#15302a;
    --flag:#dfae74; --flag-wash:#2d2419;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171a; --card:#1c1f23; --rule:#343941; --rule-soft:#272b31;
  --ink:#eceae5; --ink-soft:#9a9ea6;
  --seal:#6cc3a3; --seal-wash:#15302a;
  --flag:#dfae74; --flag-wash:#2d2419;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:34px 24px}

/* masthead */
.masthead{border-bottom:1px solid var(--rule); padding-bottom:18px}
.eyebrow{
  font-family:var(--font-data); font-size:.7rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px;
}
h1{
  font-family:var(--font-display); font-weight:400; font-size:clamp(2rem,6vw,2.7rem);
  line-height:1.05; letter-spacing:-.01em; margin:0 0 10px; text-wrap:balance;
}
.lede{margin:0; max-width:56ch; color:var(--ink-soft); font-size:.97rem}

.notice{
  display:flex; gap:10px; align-items:flex-start;
  margin-top:18px; padding:11px 14px;
  background:var(--flag-wash); border:1px solid var(--rule-soft);
  border-left:3px solid var(--flag); border-radius:3px;
  font-size:.85rem; color:var(--flag);
}
.notice b{font-weight:600; white-space:nowrap}

.prompts{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 4px}
.prompts button{
  font:inherit; font-size:.84rem; cursor:pointer;
  background:var(--card); color:var(--ink);
  border:1px solid var(--rule); border-radius:999px; padding:7px 14px;
  transition:border-color .12s ease, color .12s ease;
}
.prompts button:hover{border-color:var(--seal); color:var(--seal)}
.prompts button:focus-visible{outline:2px solid var(--seal); outline-offset:2px}

#log{display:flex; flex-direction:column; gap:14px; margin:22px 0 4px}
.turn{min-width:0}
.turn.asked{
  align-self:flex-end; max-width:min(85%,44ch);
  background:var(--seal-wash); color:var(--ink);
  border-radius:12px 12px 3px 12px; padding:10px 14px; font-size:.95rem;
}
.turn.replied{
  background:var(--card); border:1px solid var(--rule); border-radius:3px;
  padding:15px 17px;
}
.route{
  display:inline-block; font-family:var(--font-data); font-size:.64rem;
  letter-spacing:.12em; text-transform:uppercase; font-weight:500;
  padding:3px 8px; border-radius:2px; margin-bottom:10px;
  background:var(--seal-wash); color:var(--seal);
}
.route.held{background:var(--flag-wash); color:var(--flag)}
.answer{margin:0; font-size:.97rem}
.answer b{font-family:var(--font-data); font-weight:500; font-variant-numeric:tabular-nums}
.aside{margin:9px 0 0; font-size:.86rem; color:var(--ink-soft)}
.cite{
  margin-top:12px; padding-top:10px; border-top:1px solid var(--rule-soft);
  font-family:var(--font-data); font-size:.74rem; line-height:1.6; color:var(--ink-soft);
}
.cite .stamp{display:block; letter-spacing:.04em}
.cite a{color:var(--seal); overflow-wrap:anywhere}

.ask{
  position:sticky; bottom:0; display:flex; gap:8px;
  padding-block:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--paper) 22%);
}
.ask input{
  flex:1; min-width:0; font:inherit; font-size:.95rem; padding:12px 14px;
  color:var(--ink); background:var(--card);
  border:1px solid var(--rule); border-radius:4px;
}
.ask input:focus{outline:2px solid var(--seal); outline-offset:-1px}
.ask button{
  font:inherit; font-weight:600; font-size:.92rem; cursor:pointer;
  padding:12px 20px; border:0; border-radius:4px;
  background:var(--seal); color:var(--paper);
}
.ask button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

.colophon{
  border-top:1px solid var(--rule); margin-top:14px; padding-top:14px;
  font-family:var(--font-data); font-size:.7rem; line-height:1.75; color:var(--ink-soft);
}
.colophon a{color:var(--ink-soft)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important}}
</style>

<div class="sheet">
  <header class="masthead">
    <p class="eyebrow">PPFAS Mutual Fund &middot; five schemes &middot; public documents only</p>
    <h1>MF Facts Desk</h1>
    <p class="lede" id="lede"></p>
    <p class="notice"><b>Facts-only.</b><span id="notice"></span></p>
  </header>

  <div class="prompts" id="prompts"></div>

  <div id="log" aria-live="polite"></div>

  <form class="ask" id="ask" autocomplete="off">
    <input type="text" id="q" placeholder="e.g. Exit load on the Liquid Fund?" aria-label="Your question">
    <button type="submit">Ask</button>
  </form>

  <p class="colophon" id="colophon"></p>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Corpus and scheme scope, injected at build time from corpus/*.json  *
 * by scripts/build_standalone.py. Same data the Python service uses.  *
 * ------------------------------------------------------------------ */
const CORPUS = /*__CORPUS__*/ [];
const SCOPE  = /*__SCOPE__*/ {};
const COPY   = /*__COPY__*/ {};

/* ---------------------------- guards ------------------------------ */
const LINKS = {
  education: ["AMFI - Risks in mutual funds",
    "https://www.amfiindia.com/investor/knowledge-center-info?zoneName=riskInMutualFunds"],
  factsheet: ["PPFAS - Factsheet archive", "https://amc.ppfas.com/downloads/factsheet/"],
  scope:     ["PPFAS - Schemes", "https://amc.ppfas.com/schemes/"]
};

const PII = [
  ["PAN", /\b[A-Z]{5}[0-9]{4}[A-Z]\b/i],
  ["Aadhaar", /\b\d{4}[ -]?\d{4}[ -]?\d{4}\b/],
  ["phone number", /(?:\+91[ -]?)?\b[6-9]\d{9}\b/],
  ["email address", /\b[\w.+-]+@[\w-]+\.[\w.]{2,}\b/],
  ["bank or folio number", /\b(?:folio|a\/c|acc(?:ount)?)\s*(?:no\.?|number|#)?\s*[:\-]?\s*\w*\d{4,}\b/i],
  ["long account number", /\b\d{11,18}\b/],
  ["OTP", /\botp\b\s*(?:is|:)?\s*\d{4,8}\b/i]
];
const PII_WORDS = /\b(pan\s*card|aadhaar|aadhar|otp|cvv|net\s*banking\s*password)\b/i;

const ADVICE = new RegExp(
  "\\b(should i|shall i|should we|can i trust|" +
  "(good|bad|safe|wise|smart|great|solid|reliable|poor)\\s+(investment|fund|scheme|option|choice|idea|buy|bet|pick)|" +
  "is it (a )?(good|bad|safe|wise|smart)|" +
  "worth (it|buying|investing)|do you recommend|recommend(ation)?s?\\b|advice|advise|" +
  "which (one )?(is|would be) (better|best)|what.s better|better (fund|scheme|option)|" +
  "best (fund|scheme|mutual fund|option|choice)|" +
  "my portfolio|my (existing )?(investment|holdings)|rebalance|asset allocation for me|" +
  "how much should i (invest|put)|suitable for me|right for me|" +
  "buy or sell|switch out of|exit (now|this fund)|hold or (sell|redeem)|" +
  "will (it|this) (go up|grow|fall|crash|double)|predict|forecast|outlook|" +
  "tax saving strategy|save the most tax)\\b", "i");

const PERFORMANCE = new RegExp(
  "\\b(returns?|cagr|xirr|performance|performed|annualis?zed|" +
  "how much (did|has|would) (it|this|i) (give|gain|return|make|earn|grow)|" +
  "beat the (benchmark|index|market)|outperform(ed|ance)?|underperform(ed)?|" +
  "nav (history|trend|movement)|past (year|3 years|5 years) (return|performance)|" +
  "alpha\\b|track record)\\b", "i");

function guard(q){
  let kind = PII_WORDS.test(q) ? "personal identifiers" : null;
  if (!kind) for (const [label, re] of PII) if (re.test(q)) { kind = label; break; }
  if (kind) return {
    kind: "pii",
    text: "I can't take a " + kind + " here, and nothing you typed has been stored. " +
          "Please re-ask without any personal or account details - I only answer general " +
          "scheme facts from public documents.",
    link: LINKS.scope
  };
  if (ADVICE.test(q)) return {
    kind: "advice",
    text: "I'm a facts-only assistant, so I can't say whether a scheme suits you or comment " +
          "on your portfolio. I can quote published facts such as expense ratio, exit load, " +
          "lock-in, minimum SIP, riskometer or benchmark.",
    link: LINKS.education
  };
  if (PERFORMANCE.test(q)) return {
    kind: "performance",
    text: "I don't calculate or compare returns. Scheme performance is published in the AMC's " +
          "official monthly factsheet, which is the right place to read it alongside the " +
          "standard disclaimers.",
    link: LINKS.factsheet
  };
  return null;
}

/* --------------------------- retrieval ---------------------------- */
const STOP = new Set(("a an and are as at be by can do does for from how i in is it its me much my of on or please " +
  "tell that the their there this to was what whats when where which who will with you your fund scheme parag " +
  "parikh ppfas mutual").split(" "));

const SYN = {
  ter:["expense","ratio"], er:["expense","ratio"], charges:["expense","ratio"], fee:["expense","ratio"],
  fees:["expense","ratio"], cost:["expense","ratio"], lockin:["lock","in"], locked:["lock","in"],
  sip:["sip","minimum"], riskometer:["riskometer","risk"], cg:["capital","gains"],
  statement:["statement"], download:["download","statement"], manager:["manager"], managers:["manager"],
  index:["benchmark"], started:["inception"], launch:["inception"], launched:["inception"],
  old:["inception"], redeem:["exit","load"], redemption:["exit","load"], withdraw:["exit","load"]
};

const tokenize = t => {
  const out = [];
  for (const tok of (t || "").toLowerCase().match(/[a-z0-9]+/g) || []){
    if (SYN[tok]) out.push(...SYN[tok]);
    if (STOP.has(tok) || tok.length < 2) continue;
    out.push(tok);
  }
  return out;
};

const MIN_SCORE = /*__MIN_SCORE__*/ 0.24;
const docs = CORPUS.map(c => ({
  chunk: c,
  terms: tokenize([c.topic.replace(/_/g," "), c.keywords, c.answer].join(" "))
}));

const df = new Map();
for (const d of docs) for (const t of new Set(d.terms)) df.set(t, (df.get(t) || 0) + 1);
const IDF = new Map();
for (const [t, n] of df) IDF.set(t, Math.log((docs.length + 1) / (n + 0.5)));
// An unseen term is the rarest term there is: give it the maximum idf so an
// off-topic word weighs on the query vector instead of silently vanishing.
const OOV = Math.max(...IDF.values());

function vector(terms){
  const tf = new Map();
  for (const t of terms) tf.set(t, (tf.get(t) || 0) + 1);
  const vec = new Map();
  let sum = 0;
  for (const [t, c] of tf){
    const w = (1 + Math.log(c)) * (IDF.has(t) ? IDF.get(t) : OOV);
    vec.set(t, w); sum += w * w;
  }
  const norm = Math.sqrt(sum) || 1;
  for (const [t, w] of vec) vec.set(t, w / norm);
  return vec;
}
for (const d of docs) d.vec = vector(d.terms);

function detectSchemes(q){
  const text = " " + (q || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ") + " ";
  const found = [];
  for (const s of SCOPE.schemes){
    for (const alias of [s.name.toLowerCase(), s.code.toLowerCase(), ...s.aliases]){
      const m = text.match(new RegExp("\\b" + alias.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b"));
      if (m){ found.push([m.index, s.code]); break; }
    }
  }
  found.sort((a, b) => a[0] - b[0]);
  return [...new Set(found.map(f => f[1]))];
}

function search(q, scheme){
  const qv = vector(tokenize(q));
  const hits = [];
  for (const d of docs){
    if (scheme && d.chunk.scheme !== scheme && d.chunk.scheme !== "ALL") continue;
    let score = 0;
    for (const [t, w] of qv) score += w * (d.vec.get(t) || 0);
    if (scheme && d.chunk.scheme === scheme) score += 0.25;
    else if (scheme && d.chunk.scheme === "ALL") score += 0.05;
    else if (!scheme && d.chunk.scheme !== "ALL") score -= 0.10;
    if (score > 0) hits.push({ chunk: d.chunk, score });
  }
  hits.sort((a, b) => b.score - a.score || (a.chunk.id < b.chunk.id ? -1 : 1));
  return hits;
}

const schemeNames = () => SCOPE.schemes.map(s => s.name);

function ask(question){
  const q = (question || "").trim();
  if (!q) return null;

  const held = guard(q);
  if (held) return {
    kind: "refusal:" + held.kind, text: held.text,
    source_title: held.link[0], source_url: held.link[1]
  };

  const detected = detectSchemes(q);
  const hits = search(q, detected[0] || null);

  if (!hits.length || hits[0].score < MIN_SCORE) return {
    kind: "no_answer",
    text: "I don't have that in my sources. I cover expense ratio, exit and entry load, " +
          "lock-in, minimum investment and SIP, riskometer, benchmark, scheme category, " +
          "inception date, fund managers and how to download statements, for five PPFAS schemes.",
    source_title: LINKS.scope[0], source_url: LINKS.scope[1]
  };

  const top = hits[0];
  if (!detected.length && top.chunk.scheme !== "ALL") return {
    kind: "clarify", topic: top.chunk.topic,
    text: "That figure differs by scheme, so tell me which one you mean: " + schemeNames().join(", ") + ".",
    source_title: LINKS.scope[0], source_url: LINKS.scope[1]
  };

  const others = detected.slice(1)
    .map(c => SCOPE.schemes.find(s => s.code === c).name).join(", ");
  return {
    kind: "fact", topic: top.chunk.topic, chunk_id: top.chunk.id,
    score: Math.round(top.score * 1e4) / 1e4,
    text: top.chunk.answer, as_on: top.chunk.as_on,
    source_title: top.chunk.source_title, source_url: top.chunk.source_url,
    followup: others ? "Ask the same question for " + others + " to see its figure." : null
  };
}

/* ------------------------------ view ------------------------------ */
const log = document.getElementById("log");
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

// Bold the figures so a number is findable at a glance without changing the wording.
function withFigures(text){
  const p = el("p", "answer");
  const re = /(\d[\d,]*\.?\d*%|Rs\. ?[\d,]+|\b\d{1,3} (?:years?|days?|calendar days)\b)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null){
    if (m.index > last) p.appendChild(document.createTextNode(text.slice(last, m.index)));
    p.appendChild(el("b", null, m[0]));
    last = m.index + m[0].length;
  }
  p.appendChild(document.createTextNode(text.slice(last)));
  return p;
}

function render(a){
  const box = el("div", "turn replied");
  const held = a.kind.startsWith("refusal") || a.kind === "no_answer" || a.kind === "clarify";
  const label = a.kind.startsWith("refusal") ? a.kind.split(":")[1] + " - not answered"
              : a.kind === "no_answer" ? "outside my sources"
              : a.kind === "clarify" ? "needs a scheme"
              : (a.topic || "fact").replace(/_/g, " ");
  box.appendChild(el("span", "route" + (held ? " held" : ""), label));
  box.appendChild(withFigures(a.text));
  if (a.followup) box.appendChild(el("p", "aside", a.followup));

  const cite = el("div", "cite");
  if (a.as_on) cite.appendChild(el("span", "stamp", "Last updated from sources: " + a.as_on));
  const line = el("span");
  line.appendChild(document.createTextNode("Source: "));
  const link = el("a", null, a.source_title);
  link.href = a.source_url; link.target = "_blank"; link.rel = "noopener noreferrer";
  line.appendChild(link);
  cite.appendChild(line);
  box.appendChild(cite);

  log.appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "end" });
}

function submit(question){
  const answer = ask(question);
  if (!answer) return;
  const asked = el("div", "turn asked", question);
  log.appendChild(asked);
  document.getElementById("q").value = "";
  render(answer);
}

document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  submit(document.getElementById("q").value);
});

document.getElementById("lede").textContent = COPY.welcome;
document.getElementById("notice").textContent = " " + COPY.disclaimer.replace(/^Facts-only assistant\.\s*/, "");
const prompts = document.getElementById("prompts");
COPY.examples.forEach(x => {
  const b = el("button", null, x);
  b.type = "button";
  b.addEventListener("click", () => submit(x));
  prompts.appendChild(b);
});
document.getElementById("colophon").textContent =
  "Covers " + schemeNames().join(" · ") + ". " + CORPUS.length +
  " facts drawn from " + COPY.source_count + " public AMC/SEBI/AMFI pages. " +
  "Corpus last refreshed " + SCOPE.corpus_last_updated + ".";

// Open on a worked example rather than an empty shell.
submit(COPY.examples[0]);
</script>
